<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal del Alumno</title>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/alumno.css">
<link rel="stylesheet" href="css/seguridad.css"></head>

<body>

    <!-- =========================
         ENCABEZADO
    ========================== -->
    <header class="top-header">

        <div class="header-left">

            <div class="university-logo">
                <img src="images/logoUASLP.PNG" alt="UASLP">
            </div>

            <div class="portal-title">
                <h1>PORTAL DEL ALUMNO</h1>
                <p>MAESTRÍA EN TECNOLOGÍA Y GESTIÓN DEL AGUA</p>
            </div>

        </div>


        <div class="user-area">

            <div class="user-icon">
            </div>

            <div class="user-information">
                <strong>Nombre</strong>
                <span>Alumno</span>
            </div>

            <button class="user-menu-button" type="button">
                ▼
            </button>

        </div>

    </header>


    <!-- =========================
         ESTRUCTURA PRINCIPAL
    ========================== -->
    <div class="dashboard">


       <!-- ==================================================
     MENÚ LATERAL - ALUMNO
================================================== -->

<aside class="sidebar">

    <!-- INICIO -->

    <button class="sidebar-item" id="inicioAlumnoButton">
        <span class="sidebar-icon"></span>
        <span>Inicio</span>
    </button>


    <!-- MI PERFIL -->

    <button class="sidebar-item" id="perfilAlumnoButton">
        <span class="sidebar-icon"></span>
        <span>Mi perfil</span>
    </button>


    <!-- TESIS -->

    <button
        class="sidebar-item"
        id="tesisMenu">

        <span class="sidebar-icon"></span>

        <span>Tesis</span>

        <span
            class="sidebar-arrow"
            id="tesisArrow">
            ˄
        </span>

    </button>


    <!-- SUBMENU TESIS -->

    <div
        class="sidebar-submenu"
        id="tesisSubmenu">

        <button
            class="sidebar-subitem"
            id="miTesisButton">

            <span>•</span>
            <span>Mi tesis</span>

        </button>


        <button
            class="sidebar-subitem"
            id="comiteTutorialButton">

            Comité tutorial

        </button>

    </div>


    <!-- ENCUESTAS -->

    <button
        class="sidebar-item"
        id="encuestasButton">

        <span class="sidebar-icon"></span>

        <span>
            Encuestas y formularios
        </span>

    </button>


    <!-- REPORTES -->

    <button
        class="sidebar-item"
        id="reportesAlumnoButton">

        <span class="sidebar-icon"></span>

        <span>
            Reportes
        </span>

    </button>


    <!-- SEPARADOR -->

    <div class="sidebar-separator"></div>


    <!-- AYUDA -->

    <button
        class="sidebar-item"
        id="ayudaAlumnoButton">

        <span class="sidebar-icon"></span>

        <span>Ayuda</span>

    </button>


    <!-- CERRAR SESIÓN -->

    <button
        class="sidebar-item logout"
        id="cerrarSesionAlumnoButton">

        <span class="sidebar-icon"></span>

        <span>Cerrar sesión</span>

    </button>

</aside>

        </aside>


        <!-- =========================
             ÁREA DE CONTENIDO
        ========================== -->
        <main class="content" id="contentArea">

            <!--
                Inicialmente esta área queda vacía.
                El contenido aparecerá cuando
                seleccionemos una opción del menú.
            -->

        </main>

    </div>


    <script src="js/api.js"></script><script src="js/sesion.js"></script><script src="js/coordinador.js"></script><script src="js/usuarios.js"></script>

</body>
</html>
