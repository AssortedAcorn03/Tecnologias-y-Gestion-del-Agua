<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal del Alumno</title>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/alumno.css">
</head>

<body>

    <div class="student-panel">

        <!-- =========================
             ENCABEZADO
        ========================== -->

        <header class="student-header">

            <div class="student-header-content">

                <div class="student-logo-area">

                    <img
                        class="student-logo"
                        src="images/logoUASLP.PNG"
                        alt="UASLP">

                </div>


                <div class="student-title-area">

                    <h1>
                        PORTAL DEL ALUMNO
                    </h1>

                    <p>
                        MAESTRÍA EN TECNOLOGÍA Y GESTIÓN DEL AGUA
                    </p>

                </div>


                <div class="student-user-area">

                    <div class="user-icon">
                    </div>

                    <div class="user-information">

                        <strong>
                            Nombre
                        </strong>

                        <span>
                            Alumno
                        </span>

                    </div>

                    <button
                        class="user-menu-button"
                        type="button">

                        ▼

                    </button>

                </div>

            </div>

        </header>


        <!-- =========================
             CONTENIDO PRINCIPAL
        ========================== -->

        <div class="student-main">


            <!-- =========================
                 MENÚ LATERAL
            ========================== -->

            <aside class="student-sidebar">


                <!-- INICIO -->

                <button
                    class="sidebar-item"
                    id="inicioAlumnoButton">

                    <span class="sidebar-icon"></span>

                    <span>
                        Inicio
                    </span>

                </button>


                <!-- MI PERFIL -->

                <button
                    class="sidebar-item"
                    id="perfilAlumnoButton">

                    <span class="sidebar-icon"></span>

                    <span>
                        Mi perfil
                    </span>

                </button>


               <!-- TESIS -->

<div id="tesisSection" class="tesis-section">

    <button
        class="sidebar-item"
        id="tesisMenu">

        <span class="sidebar-icon"></span>

        <span>Tesis</span>

        <span
            class="sidebar-arrow"
            id="tesisArrow">
            ⌄
        </span>

    </button>


    <div
        class="sidebar-submenu"
        id="tesisSubmenu">

        <button
            class="sidebar-subitem"
            id="miTesisButton">

            <span>•</span>
            <span>Mi tesis</span>

        </button>

    </div>

</div>

                <!-- ENCUESTAS -->

                <button
                    class="sidebar-item"
                    id="encuestasButton">

                    <span class="sidebar-icon"></span>

                    <span>
                        Encuestas y formularios
                    </span>

                </button>


                <!-- REPORTES -->

                <button
                    class="sidebar-item"
                    id="reportesAlumnoButton">

                    <span class="sidebar-icon"></span>

                    <span>
                        Reportes
                    </span>

                </button>


                <!-- SEPARADOR -->

                <div class="sidebar-separator"></div>


                <!-- AYUDA -->

                <button
                    class="sidebar-item"
                    id="ayudaAlumnoButton">

                    <span class="sidebar-icon"></span>

                    <span>
                        Ayuda
                    </span>

                </button>


                <!-- CERRAR SESIÓN -->

                <button
                    class="sidebar-item logout"
                    id="cerrarSesionAlumnoButton">

                    <span class="sidebar-icon"></span>

                    <span>
                        Cerrar sesión
                    </span>

                </button>


            </aside>


            <!-- =========================
                 ÁREA DE CONTENIDO
            ========================== -->

            <main
                class="student-content"
                id="contentArea">

            </main>


        </div>

    </div>


    <script src="js/alumno.js"></script>

</body>
</html>
